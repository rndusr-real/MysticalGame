<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Krumplisteszta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap">
  <link rel="stylesheet" href="krumplisteszta.css">
</head>
<body>
  <main class="panel">
    <h1 class="title">Krumplisteszta</h1>

    <section class="block" id="login">
      <form class="stack" id="login-form">
        <label class="field-label" for="password">Jelszó</label>
        <input class="field" id="password" type="password" autocomplete="current-password" required autofocus>
        <button class="btn" id="login-button" type="submit">Belépés</button>
        <p class="status bad" id="login-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="block" id="admin" hidden aria-labelledby="levels-title">
      <p class="lead">Itt állítod be, melyik feladathoz férhet hozzá a játékos.</p>
      <div class="block-head">
        <h2 class="block-title" id="levels-title">Feladatok</h2>
        <div class="quick">
          <button class="ghost" id="open-all" type="button">Mind nyitva</button>
          <button class="ghost" id="lock-all" type="button">Mind zárva</button>
        </div>
      </div>
      <ul class="levels" id="levels"></ul>
      <p class="note">A zárolt feladatot a játék átugorja. Ha a játékos előtt már nincs nyitott feladat, a játék várakozik, és magától továbbenged, amint kinyílik egy.</p>
      <div class="actions">
        <button class="btn" id="save" type="button" disabled>Mentés</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script src="levels.js"></script>
  <script src="krumplisteszta.js"></script>
</body>
</html>
